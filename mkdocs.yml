site_name: Koala.AI
site_description: A Python framework for building AI agents.
site_author: Hariharan P R
site_url: https://koala-ai-agents.github.io/Koala.AI/

repo_name: koala-ai-agents/Koala.AI
repo_url: https://github.com/koala-ai-agents/Koala.AI
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  logo: assets/logo.png
  favicon: assets/logo.png
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: default
      primary: white
      accent: green
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: green
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow

plugins:
  - search
  - autorefs
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            heading_level: 2
            docstring_style: google
            merge_init_into_class: true
            show_signature_annotations: true
            separate_signature: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Getting Started:
      - Overview: index.md
      - Quickstart (5 min): getting-started/quickstart.md
      - Installation: getting-started/installation.md
      - Supported Providers: getting-started/providers.md
      - Configuration & Keys: getting-started/configuration.md
  - Guides:
      - Core Agent:
          - Building Agents: guide/agents.md
          - Tools & Function Calling: guide/tools.md
          - Models & Settings: guide/models.md
      - Resilience & Control:
          - Context Management & Pruning: guide/context-policy.md
          - Retries & Error Handling: guide/resilience.md
          - Structured Output & Reflection: guide/structured-output.md
      - Multi-Turn & Collaboration:
          - Memory & Conversation History: guide/memory.md
          - Multi-Agent Handoffs: guide/handoffs.md
          - Human-in-the-Loop Approvals: guide/approval-hitl.md
          - Interactive Sessions: guide/sessions.md
          - Composable Behaviors: guide/behaviors.md
      - Advanced Systems:
          - Live Streaming & Terminal UI: guide/streaming.md
          - Durable Checkpointing: guide/checkpointing.md
          - DAG Flow Orchestration: guide/flow.md
          - Model Context Protocol (MCP): guide/mcp.md
          - OpenTelemetry Observability: guide/observability.md
  - Architecture:
      - Design Principles: concepts/architecture.md
      - The Layer Stack: concepts/layers.md
      - Runnable & Events: concepts/runnable-and-events.md
  - API Reference:
      - koala.core: reference/core.md
      - koala.agents: reference/agents.md
      - koala.models: reference/models.md
      - koala.tools: reference/tools.md
      - koala.behaviors: reference/behaviors.md
      - koala.memory: reference/memory.md
      - koala.harness: reference/harness.md
      - koala.orchestration: reference/orchestration.md
      - koala.observability: reference/observability.md
      - koala.ui: reference/ui.md
  - Development:
      - Contributing: development/contributing.md
      - Testing: development/testing.md

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/koala-ai-agents/Koala.AI
