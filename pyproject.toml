[project]
name = "koala"
version = "0.1.0"
description = "A Python framework for building AI agents: typed streaming, tool loops, multi-agent handoffs, HITL approval, and DAG orchestration."
license = { file = "LICENSE" }
readme = "README.md"
authors = [
    { name = "Hariharan P R", email = "prhariharan2005@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.5",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/PR-HARIHARAN/Koala.AI"
Issues = "https://github.com/PR-HARIHARAN/Koala.AI/issues"

[project.optional-dependencies]
# Development toolchain (tests, lint, format, types).
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "pre-commit>=3.6.0",
    "mypy>=1.8.0",
]
# Model Context Protocol client — for MCPToolset.
# See koala.tools.mcp.
mcp = [
    "mcp>=1.0",
]
# OpenTelemetry emitter with GenAI semantic conventions.
# When installed, koala.observability.otel emits spans for Model calls,
# Agent runs, and Tool executions. Bring your own exporter (OTLP, Console)
# via the standard OTel SDK configuration.
otel = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-semantic-conventions>=0.48b0",
]
# Documentation site (mkdocs + material + mkdocstrings-python for auto API refs).
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
    "pymdown-extensions>=10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
packages = [
    "src/koala"
]
include = [
    "src/koala/py.typed",
]

# Quarantined legacy modules — never ship in the published distribution.
[tool.hatch.build.targets.wheel]
packages = ["src/koala"]
exclude = [
    "src/koala/_legacy/**",
]

[tool.hatch.build.targets.sdist]
exclude = [
    "src/koala/_legacy/**",
    ".venv/**",
    ".mypy_cache/**",
    ".ruff_cache/**",
    ".pytest_cache/**",
    "htmlcov/**",
    "site/**",
    "logs/**",
]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [
    "src/koala/_legacy",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line too long (handled by black)
]

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
minversion = "6.0"
addopts = [
    "-ra",
    "-q",
    "--strict-markers",
    "--cov=src/koala",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=70",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests that hit real LLM providers (needs env keys)",
    "unit: marks pure unit tests",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

# Coverage — omit legacy modules that are quarantined pending removal.
[tool.coverage.run]
source = ["src/koala"]
omit = [
    "src/koala/_legacy/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.$",
]
